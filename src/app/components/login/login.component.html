<div class="contenedor-login">
  <div class="tarjeta-login">
    <div class="cabecera-tarjeta">
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo">Ingreso a la plataforma con Firebase</p>
    </div>

    @if (mensajeError()) {
      <div class="mensaje-error">
        {{ mensajeError() }}
      </div>
    }

    <form (ngSubmit)="handleLogin()">
      <div class="campo">
        <label for="email">Correo electrónico:</label>
        <input
          id="email"
          type="email"
          class="input-control"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña:</label>
        <input
          id="password"
          type="password"
          class="input-control"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="acciones">
        <button type="submit" class="btn btn-primario w-100" [disabled]="cargando()">
          @if (cargando()) {
            Iniciando sesión...
          } @else {
            Entrar
          }
        </button>
      </div>

      <div class="enlace-registro">
        <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
